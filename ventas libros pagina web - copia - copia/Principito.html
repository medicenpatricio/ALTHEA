<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>El principito - ALTHEA</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer>
 </script>
</head>

<body class="pagina-libro
libro-Principito">

    <nav class="menu">

        <a href="index.html" class="logo">ALTHEA</a>
                <a href="#" id="abrirCarrito">
            🛒 Carrito
        </a>

    </nav>


    <main class="detalle-libro">

        <div class="imagen-detalle">

            <img src="imagenes/Principito.png"
                 alt="Portada de El principito">

        </div>


        <div class="contenido-detalle">

            <p class="genero">CLÁSICO</p>

            <h1>El principito</h1>

            <p class="autor-detalle">
                Antoine de Saint-Exupéry
            </p>

            <p class="descripcion-libro">
                Un encuentro entre un aviador y un pequeño
                viajero que recorre distintos mundos buscando
                comprender el amor, la amistad y la vida.
            </p>

            <div class="precio-detalle">
                $30.000
            </div>

            <button class="comprar-detalle comprar"
            data-id="Principito"
            data-titulo="El principito"
            data-precio="30000"
            data-imagen="imagenes/Principito.png">
                Comprar
            </button>

            <a href="libros.html" class="volver">
                ← Volver a libros
            </a>

        </div>

    </main>

    <!-- VENTANA DEL CARRITO -->

<div id="ventanaCarrito" class="ventana-carrito">

    <div class="cabecera-carrito">

        <h2>Mi carrito</h2>

        <button id="cerrarCarrito">x</button>

    </div>

    <div id="listaCarritoFlotante">

        <p>Tu carrito está vacío.</p>

    </div>

    <div class="pie-carrito">

        <p>
            Total:
            <strong id="totalCarritoFlotante">$0</strong>
        </p>

        <button id="finalizarCompraFlotante">
            Comprar
        </button>

    </div>

</div>

</body>

</html>
